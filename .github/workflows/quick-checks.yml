name: Chuchu Quick Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test benchmark tooling
        run: python -m unittest discover -s benchmarks -p test_runner.py

      - name: Test LLVM provisioning scripts
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
