# TEMPORARILY DISABLED: automatic triggers removed to save CI resources. Restore the previous push (tags: ['v*']) trigger (see git history) to re-enable.
name: Tested native release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching Cargo.toml, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: python
        run: |
          import os, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert tag == 'v' + version, 'Tag must match the compiler version'
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          assert commit == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('commit=' + commit + '\n')
  build:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/native-build.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      ref: ${{ needs.validate-release.outputs.commit }}
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cheeku-*
          path: distributions
          merge-multiple: true
      - name: Assemble website download manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python installer/assemble.py --directory distributions --version "${RELEASE_TAG#v}"
      - name: Create a draft containing only tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" distributions/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/release-runtime.md
