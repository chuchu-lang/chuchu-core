name: Tested native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching Cargo.toml, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: installer-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate-release:
    if: github.repository == 'chuchu-lang/chuchu-core' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      skip: ${{ steps.validate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python installer/release_control.py validate
  build:
    needs: validate-release
    if: needs.validate-release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/native-build.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      ref: ${{ needs.validate-release.outputs.commit }}
  draft-release:
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: cheeku-*
          path: distributions
          merge-multiple: true
      - name: Assemble and validate the complete production release
        run: |
          python installer/assemble.py --directory distributions --version "$RELEASE_VERSION" --base-url https://downloads.chuchu-lang.org
          python installer/publish_s3.py --directory distributions --version "$RELEASE_VERSION" --validate-only
      - name: Create or refresh a draft containing only tested installers
        run: python installer/release_control.py draft
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: distributions/*
          if-no-files-found: error
          retention-days: 30
  deploy:
    needs: [validate-release, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://downloads.chuchu-lang.org/latest.json
    # Serialize all versions; S3 conditional writes also protect against stale runs.
    concurrency:
      group: installer-production-deployment
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: distributions
      - name: Validate deployment configuration and artifacts before AWS authentication
        run: |
          python installer/publish_s3.py --check-config
          python installer/publish_s3.py --directory distributions --version "$RELEASE_VERSION" --validate-only
      - name: Install deployment SDK
        run: python -m pip install -r installer/requirements-release.txt
      - name: Assume production AWS role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: chuchu-release-${{ github.run_id }}
          unset-current-credentials: true
      - name: Publish verified files, then latest.json, and verify CloudFront
        run: python installer/publish_s3.py --directory distributions --version "$RELEASE_VERSION"
      - name: Finalize GitHub Release after successful deployment
        run: python installer/release_control.py finalize
      - name: Report deployed release URLs
        run: |
          {
            echo "Released Chuchu $RELEASE_VERSION"
            echo
            echo "Update manifest: https://downloads.chuchu-lang.org/latest.json"
            echo "Manifest snapshot: https://downloads.chuchu-lang.org/cheeku-$RELEASE_VERSION.json"
            echo "Checksums: https://downloads.chuchu-lang.org/SHA256SUMS-$RELEASE_VERSION"
            echo "GitHub Release: https://github.com/chuchu-lang/chuchu-core/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
